services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: daily-task-planner
    ports:
      - "3000:3000"
    environment:
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
    volumes:
      - task-data:/app/backend/data
    restart: unless-stopped

volumes:
  task-data:
