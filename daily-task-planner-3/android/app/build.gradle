plugins {
    id 'com.android.application'
}

def plannerUrl = (project.findProperty('plannerUrl') ?: System.getenv('PLANNER_PUBLIC_URL') ?: '').toString().trim()
if (!plannerUrl) {
    throw new GradleException('Set PLANNER_PUBLIC_URL (or pass -PplannerUrl=...) to the public HTTPS planner URL before building the Android app.')
}
def plannerUri
try {
    plannerUri = new java.net.URI(plannerUrl)
} catch (Exception ignored) {
    throw new GradleException('PLANNER_PUBLIC_URL must be a valid public HTTPS origin.')
}
if (!'https'.equalsIgnoreCase(plannerUri.scheme) || !plannerUri.host
        || plannerUri.userInfo || plannerUri.query || plannerUri.fragment
        || (plannerUri.path && plannerUri.path != '/')) {
    throw new GradleException('PLANNER_PUBLIC_URL must be a valid public HTTPS origin.')
}
plannerUrl = plannerUri.toString().endsWith('/') ? plannerUri.toString() : plannerUri.toString() + '/'

android {
    namespace 'com.karthi.dailyplanner'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.karthi.dailyplanner'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'PLANNER_URL', '"' + plannerUrl + '"'
    }
}
